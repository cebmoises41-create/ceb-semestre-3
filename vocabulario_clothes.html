<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothes - Complete the Sentence</title>
    <style>
        body { margin:0; padding:20px; min-height:100vh; display:flex; justify-content:center; align-items:center; font-family:sans-serif; background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%); }
        .floating-words { position:fixed; width:100%; height:100%; top:0; left:0; pointer-events:none; z-index:0; overflow:hidden; }
        .word { position:absolute; color:rgba(46, 204, 113, 0.08); font-weight:900; font-size:5rem; transform:rotate(-15deg); user-select:none; }
        .w1 { top:5%; left:-5%; } .w2 { bottom:5%; right:-5%; } .w3 { top:50%; left:10%; font-size:3rem; }
        
        .game-container { position:relative; z-index:1; background:rgba(255,255,255,0.95); backdrop-filter:blur(5px); padding:40px; border-radius:30px; box-shadow:0 15px 40px rgba(0,0,0,0.1); max-width:700px; width:100%; text-align:center; border:1px solid rgba(255,255,255,0.8); }
        .title { font-size:2.8rem; font-weight:900; color:#1c3d3b; margin:0; }
        .sub { color:#6c757d; margin-bottom:20px; }
        
        /* -- LOGIN -- */
        #login-screen { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px 0; }
        #login-screen input { padding:12px 15px; font-size:1.1rem; border:2px solid #ced4da; border-radius:12px; width:250px; text-align:center; margin:8px 0; outline:none; transition:0.3s; }
        #login-screen input:focus { border-color:#2ecc71; box-shadow:0 0 0 3px rgba(46,204,113,0.2); }
        #login-screen button { background:#2ecc71; color:white; border:none; padding:14px 40px; border-radius:30px; font-weight:bold; font-size:1.1rem; cursor:pointer; transition:0.3s; margin-top:15px; box-shadow:0 4px 0 #27ae60; }
        #login-screen button:hover { transform:translateY(-2px); }
        #login-error { color:#e74c3c; font-weight:bold; margin-top:10px; display:none; background:#fde8e8; padding:8px 15px; border-radius:8px; }
        
        /* -- JUEGO -- */
        #game-screen { display:none; }
        .status-bar { display:flex; justify-content:space-between; align-items:center; background:#f8f9fa; padding:10px 20px; border-radius:15px; margin-bottom:20px; border:1px solid #e9ecef; flex-wrap:wrap; gap:10px; }
        #player-name { font-weight:bold; color:#1c3d3b; font-size:1.1rem; }
        #timer-display { font-weight:bold; color:#c0392b; font-size:1.3rem; background:#fff; padding:5px 15px; border-radius:20px; border:2px solid #c0392b; }
        
        /* PREGUNTA */
        #pregunta-container {
            background: #f8f9fa;
            border-radius: 20px;
            padding: 30px 25px;
            margin-bottom: 20px;
        }
        #pregunta {
            font-size: 1.6rem;
            margin: 10px 0;
            color: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        #pregunta .emoji-big {
            font-size: 5rem;
            line-height: 1.2;
            display: block;
            background: #fff;
            padding: 15px 30px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 150px;
        }
        #pregunta .sentence {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1c3d3b;
            background: #fff;
            padding: 15px 25px;
            border-radius: 15px;
            width: 100%;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        #pregunta .sentence .blank {
            display: inline-block;
            min-width: 100px;
            border-bottom: 4px dashed #2ecc71;
            color: #2ecc71;
            font-weight: 900;
            padding: 0 8px;
        }
        #pregunta .sentence .hint {
            font-size: 0.9rem;
            color: #6c757d;
            font-weight: 400;
        }
        #pregunta .instruction-text {
            font-weight: 600;
            font-size: 1rem;
            color: #6c757d;
        }

        /* OPCIONES */
        .btn-opcion {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 14px 20px;
            margin: 8px;
            border-radius: 15px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.3s;
            width: 85%;
            max-width: 350px;
            box-shadow: 0 4px 0 #27ae60;
            text-align: center;
        }
        .btn-opcion:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 0 #27ae60;
        }
        .btn-opcion:disabled {
            opacity: 0.6;
            transform: translateY(2px);
            box-shadow: 0 2px 0 #27ae60;
            cursor: not-allowed;
        }
        .btn-opcion.correct {
            background: #28a745;
            box-shadow: 0 4px 0 #1e7e34;
        }
        .btn-opcion.wrong {
            background: #dc3545;
            box-shadow: 0 4px 0 #a71d2a;
        }
        .resultado {
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 15px;
            min-height: 40px;
        }
        #contador {
            font-weight: bold;
            margin-top: 20px;
            font-size: 1.2rem;
            color: #2980b9;
        }
        .back-btn {
            display: inline-block;
            text-decoration: none;
            color: #495057;
            background: #e9ecef;
            padding: 12px 35px;
            border-radius: 30px;
            font-weight: bold;
            margin-top: 30px;
            border: 1px solid #ced4da;
            transition: 0.3s;
        }
        .back-btn:hover {
            background: #ced4da;
        }
        
        .final-score-box {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            border: 2px solid #2ecc71;
            margin-top: 20px;
            display: none;
        }
        .final-score-box h2 {
            color: #1c3d3b;
            margin: 0;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .game-container { padding: 20px; }
            #pregunta .emoji-big { font-size: 3.5rem; max-width: 120px; }
            #pregunta .sentence { font-size: 1.2rem; padding: 12px 15px; }
            .btn-opcion { width: 95%; font-size: 0.95rem; padding: 12px 15px; }
            .status-bar { flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>
    <div class="floating-words">
        <div class="word w1">CLOTHES</div>
        <div class="word w2">FASHION</div>
        <div class="word w3">WEAR</div>
    </div>

    <div class="game-container">
        <h1 class="title">👔 Clothes</h1>
        <p class="sub">Completa la oración con la prenda correcta</p>

        <!-- LOGIN -->
        <div id="login-screen">
            <p style="color:#6c757d; margin-bottom:5px;">Enter your name:</p>
            <input type="text" id="input-name" placeholder="Your name">
            <p style="color:#6c757d; margin-bottom:5px; margin-top:15px;">Enter Access Code:</p>
            <input type="password" id="input-code" placeholder="Code">
            <button onclick="verificarAcceso()">Enter Game</button>
            <p id="login-error">❌ Incorrect code. Try again.</p>
        </div>

        <!-- JUEGO -->
        <div id="game-screen">
            <div class="status-bar">
                <span id="player-name">👋 Welcome, Student!</span>
                <span id="timer-display">⏱️ 100s</span>
            </div>

            <div id="pregunta-container">
                <div id="pregunta">Loading...</div>
                <div id="botones"></div>
            </div>

            <p class="resultado" id="respuesta"></p>
            <p id="contador">Points: 0 / 20</p>

            <div class="final-score-box" id="score-box">
                <h2>🎉 Completed!</h2>
                <p id="final-message" style="font-size:1.3rem; font-weight:bold;"></p>
            </div>
            <a href="menu.html" class="back-btn">← Back to Menu</a>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. SISTEMA DE CÓDIGOS DINÁMICOS (3 INTENTOS)
        // ============================================================
        const getCorrectCode = () => {
            let count = parseInt(localStorage.getItem('clothes_attempts')) || 0;
            return count >= 3 ? "9999" : "2025";
        };

        let playerName = "Student";
        let timerInterval;
        let timeLeft = 100;
        let juegoTerminado = false;

        // ============================================================
        // 2. BANCO DE 40 PREGUNTAS - CLOTHES
        // ============================================================
        const BANCO_PREGUNTAS = [
            // { emoji, sentence, correct, wrong1, wrong2, wrong3 }
            { emoji: '👕', sentence: 'Sara wears a black ______.', correct: 'T-shirt', wrong: ['Pants', 'Shorts', 'Skirt'] },
            { emoji: '👗', sentence: 'Maria wears a beautiful ______.', correct: 'Dress', wrong: ['Skirt', 'Shirt', 'Jacket'] },
            { emoji: '👖', sentence: 'He is wearing blue ______.', correct: 'Jeans', wrong: ['Shorts', 'Pants', 'Leggings'] },
            { emoji: '👔', sentence: 'My father wears a ______ to work.', correct: 'Tie', wrong: ['Belt', 'Hat', 'Scarf'] },
            { emoji: '🧥', sentence: 'It\'s cold. I need a ______.', correct: 'Coat', wrong: ['Jacket', 'Sweater', 'Vest'] },
            { emoji: '👟', sentence: 'I run in my white ______.', correct: 'Sneakers', wrong: ['Boots', 'Sandals', 'Shoes'] },
            { emoji: '🧢', sentence: 'He wears a ______ on his head.', correct: 'Cap', wrong: ['Hat', 'Helmet', 'Scarf'] },
            { emoji: '🧦', sentence: 'I wear blue ______ with my shoes.', correct: 'Socks', wrong: ['Gloves', 'Boots', 'Leggings'] },
            { emoji: '🧣', sentence: 'It\'s winter. She wears a ______.', correct: 'Scarf', wrong: ['Tie', 'Belt', 'Necklace'] },
            { emoji: '👗', sentence: 'She is wearing a long ______.', correct: 'Skirt', wrong: ['Dress', 'Shorts', 'Pants'] },
            { emoji: '👕', sentence: 'I wear a ______ with jeans.', correct: 'Shirt', wrong: ['T-shirt', 'Blouse', 'Sweater'] },
            { emoji: '👔', sentence: 'He wears a ______ with his suit.', correct: 'Tie', wrong: ['Belt', 'Hat', 'Scarf'] },
            { emoji: '🧥', sentence: 'My mom has a new ______.', correct: 'Jacket', wrong: ['Coat', 'Sweater', 'Vest'] },
            { emoji: '👟', sentence: 'These ______ are very comfortable.', correct: 'Shoes', wrong: ['Sneakers', 'Boots', 'Sandals'] },
            { emoji: '🧢', sentence: 'I wear a ______ to protect my eyes.', correct: 'Hat', wrong: ['Cap', 'Helmet', 'Scarf'] },
            { emoji: '👖', sentence: 'He is wearing brown ______.', correct: 'Pants', wrong: ['Jeans', 'Shorts', 'Leggings'] },
            { emoji: '👗', sentence: 'She wears a short ______.', correct: 'Skirt', wrong: ['Dress', 'Shorts', 'Pants'] },
            { emoji: '👕', sentence: 'I need a new ______ for the party.', correct: 'Blouse', wrong: ['Shirt', 'T-shirt', 'Sweater'] },
            { emoji: '🧥', sentence: 'He wears a ______ in the winter.', correct: 'Sweater', wrong: ['Jacket', 'Coat', 'Vest'] },
            { emoji: '👟', sentence: 'I wear ______ in the summer.', correct: 'Sandals', wrong: ['Shoes', 'Sneakers', 'Boots'] },
            { emoji: '🧢', sentence: 'He wears a ______ when he rides his bike.', correct: 'Helmet', wrong: ['Cap', 'Hat', 'Scarf'] },
            { emoji: '🧦', sentence: 'I wear warm ______ in winter.', correct: 'Socks', wrong: ['Gloves', 'Boots', 'Leggings'] },
            { emoji: '👔', sentence: 'He uses a ______ to hold his pants.', correct: 'Belt', wrong: ['Tie', 'Scarf', 'Sash'] },
            { emoji: '👗', sentence: 'She wears a beautiful ______ to the party.', correct: 'Dress', wrong: ['Skirt', 'Shirt', 'Jacket'] },
            { emoji: '👖', sentence: 'He wears comfortable ______ at home.', correct: 'Shorts', wrong: ['Pants', 'Jeans', 'Leggings'] },
            { emoji: '🧥', sentence: 'I wear a ______ over my shirt.', correct: 'Vest', wrong: ['Jacket', 'Coat', 'Sweater'] },
            { emoji: '👟', sentence: 'I wear my new ______ to school.', correct: 'Shoes', wrong: ['Sneakers', 'Boots', 'Sandals'] },
            { emoji: '🧢', sentence: 'She wears a ______ to cover her head.', correct: 'Scarf', wrong: ['Hat', 'Cap', 'Helmet'] },
            { emoji: '👕', sentence: 'I need to wash my white ______.', correct: 'T-shirt', wrong: ['Shirt', 'Blouse', 'Sweater'] },
            { emoji: '👔', sentence: 'He wears a ______ with his uniform.', correct: 'Tie', wrong: ['Belt', 'Hat', 'Scarf'] },
            { emoji: '👗', sentence: 'My sister loves wearing ______.', correct: 'Dresses', wrong: ['Skirts', 'Shirts', 'Jackets'] },
            { emoji: '🧦', sentence: 'I need new ______ for my boots.', correct: 'Socks', wrong: ['Gloves', 'Leggings', 'Shoes'] },
            { emoji: '🧣', sentence: 'She wears a ______ around her neck.', correct: 'Scarf', wrong: ['Tie', 'Belt', 'Necklace'] },
            { emoji: '👟', sentence: 'These ______ are perfect for hiking.', correct: 'Boots', wrong: ['Shoes', 'Sneakers', 'Sandals'] },
            { emoji: '🧢', sentence: 'He always wears a ______ in winter.', correct: 'Hat', wrong: ['Cap', 'Helmet', 'Scarf'] },
            { emoji: '👖', sentence: 'She is wearing tight ______.', correct: 'Leggings', wrong: ['Jeans', 'Pants', 'Shorts'] },
            { emoji: '👕', sentence: 'I wear a ______ to sleep.', correct: 'Pajamas', wrong: ['Shirt', 'T-shirt', 'Sweater'] },
            { emoji: '🧥', sentence: 'My dad has a brown leather ______.', correct: 'Jacket', wrong: ['Coat', 'Sweater', 'Vest'] },
            { emoji: '👔', sentence: 'He wears a ______ with his tuxedo.', correct: 'Bow tie', wrong: ['Tie', 'Belt', 'Scarf'] },
            { emoji: '👗', sentence: 'My mom wears a ______ to the office.', correct: 'Blouse', wrong: ['Shirt', 'T-shirt', 'Sweater'] }
        ];

        // ============================================================
        // 3. VARIABLES GLOBALES
        // ============================================================
        let preguntasActuales = [];
        let indiceActual = 0;
        let puntaje = 0;

        // ============================================================
        // 4. LOGIN
        // ============================================================
        function verificarAcceso() {
            const nameInput = document.getElementById('input-name').value.trim();
            const codeInput = document.getElementById('input-code').value.trim();
            const errorMsg = document.getElementById('login-error');

            if (nameInput === "") { alert("Please enter your name."); return; }

            const requiredCode = getCorrectCode();
            if (codeInput !== requiredCode) {
                errorMsg.style.display = "block";
                document.getElementById('input-code').value = "";
                return;
            }

            let count = parseInt(localStorage.getItem('clothes_attempts')) || 0;
            localStorage.setItem('clothes_attempts', count + 1);

            errorMsg.style.display = "none";
            playerName = nameInput;
            document.getElementById('login-screen').style.display = "none";
            document.getElementById('game-screen').style.display = "block";
            document.getElementById('player-name').innerHTML = `👋 Welcome, ${playerName}!`;
            iniciarJuego();
        }

        // ============================================================
        // 5. INICIO DEL JUEGO
        // ============================================================
        function iniciarJuego() {
            juegoTerminado = false;
            indiceActual = 0;
            puntaje = 0;

            const mezcladas = [...BANCO_PREGUNTAS].sort(() => Math.random() - 0.5);
            preguntasActuales = mezcladas.slice(0, 20);

            document.getElementById('score-box').style.display = 'none';
            document.getElementById('contador').style.display = 'block';
            document.getElementById('contador').innerHTML = `Points: 0 / 20`;
            document.getElementById('respuesta').innerHTML = '';

            iniciarCronometro();
            mostrarPregunta();
        }

        // ============================================================
        // 6. CRONÓMETRO (100 SEGUNDOS)
        // ============================================================
        function iniciarCronometro() {
            timeLeft = 100;
            document.getElementById('timer-display').innerHTML = `⏱️ ${timeLeft}s`;
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-display').innerHTML = `⏱️ ${timeLeft}s`;
                if (timeLeft <= 0 && !juegoTerminado) {
                    clearInterval(timerInterval);
                    finalizarJuego("⏰ Time's Up!");
                }
            }, 1000);
        }

        // ============================================================
        // 7. MOSTRAR PREGUNTA
        // ============================================================
        function mostrarPregunta() {
            if (juegoTerminado) return;

            if (indiceActual >= preguntasActuales.length) {
                finalizarJuego("🎉 Completed!");
                return;
            }

            const q = preguntasActuales[indiceActual];
            
            // Mezclar opciones
            const opciones = [q.correct, ...q.wrong];
            const mezcladas = opciones.sort(() => Math.random() - 0.5);
            const indiceCorrecta = mezcladas.indexOf(q.correct);

            // Mostrar pregunta con emoji grande
            document.getElementById('pregunta').innerHTML = `
                <span class="emoji-big">${q.emoji}</span>
                <span class="sentence">
                    ${q.sentence.replace('______', '<span class="blank">______</span>')}
                    <span class="hint"> (${q.emoji})</span>
                </span>
                <span class="instruction-text">✏️ Choose the correct word:</span>
            `;

            document.getElementById('respuesta').innerHTML = "";
            document.getElementById('contador').innerHTML = `Points: ${puntaje} / ${preguntasActuales.length}`;

            // Generar botones de opciones
            let html = "";
            mezcladas.forEach((opt, idx) => {
                const isCorrect = idx === indiceCorrecta;
                html += `<button class="btn-opcion" onclick="verificar(${idx}, ${isCorrect})" data-correct="${isCorrect}">${opt}</button>`;
            });
            document.getElementById('botones').innerHTML = html;
        }

        // ============================================================
        // 8. VERIFICAR RESPUESTA
        // ============================================================
        function verificar(idx, isCorrect) {
            if (juegoTerminado) return;

            const btns = document.querySelectorAll('.btn-opcion');
            btns.forEach(b => b.disabled = true);

            btns.forEach((btn, i) => {
                const correct = btn.dataset.correct === 'true';
                if (correct) {
                    btn.classList.add('correct');
                } else if (i === idx && !isCorrect) {
                    btn.classList.add('wrong');
                }
            });

            const res = document.getElementById('respuesta');
            if (isCorrect) {
                puntaje++;
                res.innerHTML = "✅ Correct! Well done!";
                res.style.color = "#28a745";
            } else {
                let correctText = '';
                btns.forEach(btn => {
                    if (btn.dataset.correct === 'true') {
                        correctText = btn.textContent.trim();
                    }
                });
                res.innerHTML = `❌ Incorrect. The correct answer is: "${correctText}"`;
                res.style.color = "#dc3545";
            }

            indiceActual++;
            document.getElementById('contador').innerHTML = `Points: ${puntaje} / ${preguntasActuales.length}`;

            setTimeout(mostrarPregunta, 1500);
        }

        // ============================================================
        // 9. FINALIZAR JUEGO
        // ============================================================
        function finalizarJuego(mensaje) {
            if (juegoTerminado) return;
            juegoTerminado = true;
            clearInterval(timerInterval);

            document.querySelectorAll('.btn-opcion').forEach(b => b.disabled = true);

            localStorage.setItem('clothes_score', puntaje);

            let history = JSON.parse(localStorage.getItem('clothes_history')) || [];
            history.push({
                name: playerName,
                score: puntaje,
                total: preguntasActuales.length,
                date: new Date().toISOString().slice(0, 10),
                game: 'Clothes'
            });
            localStorage.setItem('clothes_history', JSON.stringify(history));

            document.getElementById('score-box').style.display = 'block';
            document.getElementById('final-message').innerHTML =
                `${mensaje}<br>${playerName}, you got <span style="color:#2ecc71; font-size:2rem;">${puntaje}</span> out of ${preguntasActuales.length} correct!`;

            document.getElementById('contador').style.display = 'none';
            document.getElementById('respuesta').innerHTML = '';
            document.getElementById('pregunta').innerHTML = '🏁 Game Finished!';
            document.getElementById('botones').innerHTML = '';
        }

        // ============================================================
        // 10. PERMITIR ENTER EN LOGIN
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const loginScreen = document.getElementById('login-screen');
                if (loginScreen.style.display !== 'none') {
                    verificarAcceso();
                }
            }
        });
    </script>
</body>
</html>
