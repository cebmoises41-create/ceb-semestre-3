<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professions</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        body { margin:0; padding:20px; min-height:100vh; display:flex; justify-content:center; align-items:center; font-family:sans-serif; background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%); }
        .floating-words { position:fixed; width:100%; height:100%; top:0; left:0; pointer-events:none; z-index:0; overflow:hidden; }
        .word { position:absolute; color:rgba(231, 76, 60, 0.1); font-weight:900; font-size:5rem; transform:rotate(-15deg); user-select:none; }
        .w1 { top:5%; left:-5%; } .w2 { bottom:5%; right:-5%; } .w3 { top:50%; right:10%; font-size:3rem; }
        
        .game-container { position:relative; z-index:1; background:rgba(255,255,255,0.95); backdrop-filter:blur(5px); padding:40px; border-radius:30px; box-shadow:0 15px 40px rgba(0,0,0,0.1); max-width:600px; width:100%; text-align:center; border:1px solid rgba(255,255,255,0.8); }
        .title { font-size:2.8rem; font-weight:900; color:#1c3d3b; margin:0; }
        .sub { color:#6c757d; margin-bottom:20px; }
        
        /* -- LOGIN -- */
        #login-screen { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px 0; }
        #login-screen input { padding:12px 15px; font-size:1.1rem; border:2px solid #ced4da; border-radius:12px; width:250px; text-align:center; margin:8px 0; outline:none; transition:0.3s; }
        #login-screen input:focus { border-color:#e67e22; box-shadow:0 0 0 3px rgba(230,126,34,0.2); }
        #login-screen button { background:#e67e22; color:white; border:none; padding:14px 40px; border-radius:30px; font-weight:bold; font-size:1.1rem; cursor:pointer; transition:0.3s; margin-top:15px; box-shadow:0 4px 0 #b85e19; }
        #login-screen button:hover { transform:translateY(-2px); }
        #login-error { color:#e74c3c; font-weight:bold; margin-top:10px; display:none; background:#fde8e8; padding:8px 15px; border-radius:8px; }
        
        /* -- JUEGO -- */
        #game-screen { display:none; }
        .status-bar { display:flex; justify-content:space-between; align-items:center; background:#f8f9fa; padding:10px 20px; border-radius:15px; margin-bottom:20px; border:1px solid #e9ecef; }
        #player-name { font-weight:bold; color:#1c3d3b; font-size:1.1rem; }
        #timer-display { font-weight:bold; color:#c0392b; font-size:1.3rem; background:#fff; padding:5px 15px; border-radius:20px; border:2px solid #c0392b; }
        
        #pregunta { font-size:1.4rem; margin:20px 0; color:#2c3e50; }
        .btn-opcion { background: #e67e22; color:white; border:none; padding:12px 20px; margin:6px; border-radius:15px; font-weight:bold; cursor:pointer; font-size:1.1rem; transition:0.3s; width:80%; max-width:300px; box-shadow:0 4px 0 #b85e19; }
        .btn-opcion:hover { transform:translateY(-3px); box-shadow:0 6px 0 #b85e19; }
        .btn-opcion:disabled { opacity:0.6; transform:translateY(2px); box-shadow:0 2px 0 #b85e19; cursor:not-allowed; }
        .resultado { font-size:1.2rem; font-weight:bold; margin-top:15px; }
        #contador { font-weight:bold; margin-top:20px; font-size:1.2rem; color:#2980b9; }
        .back-btn { display:inline-block; text-decoration:none; color:#495057; background:#e9ecef; padding:12px 35px; border-radius:30px; font-weight:bold; margin-top:30px; border:1px solid #ced4da; transition:0.3s; }
        .back-btn:hover { background:#ced4da; }
    </style>
</head>
<body>
    <div class="floating-words">
        <div class="word w1">JOBS</div> <div class="word w2">CAREERS</div> <div class="word w3">ENGLISH</div>
    </div>

    <div class="game-container">
        <h1 class="title">Professions</h1>
        <p class="sub">Access Code Required</p>

        <!-- LOGIN -->
        <div id="login-screen">
            <p style="color:#6c757d; margin-bottom:5px;">Enter your name:</p>
            <input type="text" id="input-name" placeholder="Your name">
            <p style="color:#6c757d; margin-bottom:5px; margin-top:15px;">Enter Access Code:</p>
            <input type="password" id="input-code" placeholder="Code">
            <button onclick="verificarAcceso()">Enter Game</button>
            <p id="login-error">❌ Incorrect code. Try again.</p>
        </div>

        <!-- JUEGO -->
        <div id="game-screen">
            <div class="status-bar">
                <span id="player-name">👋 Welcome, Student!</span>
                <span id="timer-display">⏱️ 100s</span>
            </div>
            <h3 id="pregunta">Loading...</h3>
            <div id="botones"></div>
            <p class="resultado" id="respuesta"></p>
            <p id="contador">Points: 0 / 20</p>
            <a href="menu.html" class="back-btn">← Back to Menu</a>
        </div>
    </div>

    <script>
        // --- SISTEMA DE CÓDIGOS DINÁMICOS (3 INTENTOS) ---
        const getCorrectCode = () => {
            let count = parseInt(localStorage.getItem('professions_attempts')) || 0;
            if (count >= 3) {
                return "9999";
            } else {
                return "2025";
            }
        };

        let playerName = "Student";
        let timerInterval;
        let timeLeft = 100; // CAMBIADO A 100 SEGUNDOS

        function verificarAcceso() {
            const nameInput = document.getElementById('input-name').value.trim();
            const codeInput = document.getElementById('input-code').value.trim();
            const errorMsg = document.getElementById('login-error');

            if(nameInput === "") { alert("Please enter your name."); return; }
            
            const requiredCode = getCorrectCode();
            if(codeInput !== requiredCode) {
                errorMsg.style.display = "block";
                document.getElementById('input-code').value = "";
                return;
            }

            let count = parseInt(localStorage.getItem('professions_attempts')) || 0;
            localStorage.setItem('professions_attempts', count + 1);

            errorMsg.style.display = "none";
            playerName = nameInput;
            document.getElementById('login-screen').style.display = "none";
            document.getElementById('game-screen').style.display = "block";
            document.getElementById('player-name').innerHTML = `👋 Welcome, ${playerName}!`;
            iniciarCronometro();
            cargar();
        }

        // --- CRONÓMETRO (100 SEGUNDOS) ---
        function iniciarCronometro() {
            timeLeft = 100;
            document.getElementById('timer-display').innerHTML = `⏱️ ${timeLeft}s`;
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-display').innerHTML = `⏱️ ${timeLeft}s`;
                if(timeLeft <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('pregunta').innerHTML = "⏰ Time's Up!";
                    document.getElementById('botones').innerHTML = `<h3 style="color:#c0392b;">${playerName}, you got ${a} out of ${preguntasActuales.length} before time ran out.</h3>`;
                    document.getElementById('respuesta').innerHTML = "";
                    document.getElementById('contador').innerHTML = "";
                    const btns = document.querySelectorAll('.btn-opcion');
                    btns.forEach(b => b.disabled = true);
                }
            }, 1000);
        }

        // --- BANCO DE 40 PREGUNTAS ---
        const BANCO_PREGUNTAS = [
            {q:'How do you say "Maestro"?', o:['Doctor','Professor','Student','Teacher'], c:3},
            {q:'How do you say "Ingeniero"?', o:['Engineer','Scientist','Architect','Pilot'], c:0},
            {q:'How do you say "Abogado"?', o:['Judge','Agent','Police','Lawyer'], c:3},
            {q:'How do you say "Doctor"?', o:['Doctor','Surgeon','Nurse','Patient'], c:0},
            {q:'How do you say "Contador"?', o:['Manager','Banker','Auditor','Accountant'], c:3},
            {q:'How do you say "Dentista"?', o:['Doctor','Nurse','Surgeon','Dentist'], c:3},
            {q:'How do you say "Programador"?', o:['Analyst','Engineer','Designer','Programmer'], c:3},
            {q:'How do you say "Arquitecto"?', o:['Builder','Designer','Architect','Engineer'], c:2},
            {q:'How do you say "Policía"?', o:['Officer','Soldier','Firefighter','Police'], c:3},
            {q:'How do you say "Enfermera"?', o:['Patient','Assistant','Doctor','Nurse'], c:3},
            {q:'How do you say "Bombero"?', o:['Firefighter','Rescuer','Soldier','Police'], c:0},
            {q:'How do you say "Veterinario"?', o:['Surgeon','Doctor','Nurse','Veterinarian'], c:3},
            {q:'How do you say "Carpintero"?', o:['Builder','Engineer','Carpenter','Woodworker'], c:2},
            {q:'How do you say "Piloto"?', o:['Pilot','Driver','Captain','Crew'], c:0},
            {q:'How do you say "Chef"?', o:['Cook','Chef','Baker','Culinary'], c:1},
            {q:'How do you say "Fotógrafo"?', o:['Painter','Artist','Designer','Photographer'], c:3},
            {q:'How do you say "Científico"?', o:['Teacher','Researcher','Scientist','Engineer'], c:2},
            {q:'How do you say "Periodista"?', o:['Writer','Reporter','Journalist','Editor'], c:2},
            {q:'How do you say "Músico"?', o:['Artist','Singer','Musician','Composer'], c:2},
            {q:'How do you say "Secretario"?', o:['Assistant','Secretary','Manager','Receptionist'], c:1},
            {q:'How do you say "Vendedor"?', o:['Salesperson','Seller','Manager','Clerk'], c:0},
            {q:'How do you say "Cartero"?', o:['Mailman','Postman','Delivery','Driver'], c:0},
            {q:'How do you say "Granjero"?', o:['Farmer','Gardener','Worker','Rancher'], c:0},
            {q:'How do you say "Pintor"?', o:['Painter','Artist','Decorator','Designer'], c:0},
            {q:'How do you say "Cantante"?', o:['Singer','Musician','Artist','Composer'], c:0},
            {q:'How do you say "Bailarín"?', o:['Dancer','Performer','Artist','Actor'], c:0},
            {q:'How do you say "Electricista"?', o:['Electrician','Mechanic','Engineer','Technician'], c:0},
            {q:'How do you say "Plomero"?', o:['Plumber','Mechanic','Carpenter','Builder'], c:0},
            {q:'How do you say "Jardinero"?', o:['Gardener','Farmer','Landscaper','Worker'], c:0},
            {q:'How do you say "Recepcionista"?', o:['Receptionist','Secretary','Assistant','Manager'], c:0},
            {q:'How do you say "Cajero"?', o:['Cashier','Clerk','Seller','Banker'], c:0},
            {q:'How do you say "Mecánico"?', o:['Mechanic','Engineer','Technician','Carpenter'], c:0},
            {q:'How do you say "Cocinero"?', o:['Cook','Chef','Baker','Culinary'], c:0},
            {q:'How do you say "Conserje"?', o:['Janitor','Custodian','Cleaner','Maintenance'], c:0},
            {q:'How do you say "Conductor"?', o:['Driver','Pilot','Captain','Chauffeur'], c:0},
            {q:'How do you say "Auxiliar"?', o:['Assistant','Helper','Aide','Partner'], c:0},
            {q:'How do you say "Investigador"?', o:['Researcher','Scientist','Engineer','Teacher'], c:0},
            {q:'How do you say "Analista"?', o:['Analyst','Engineer','Researcher','Scientist'], c:0},
            {q:'How do you say "Gerente"?', o:['Manager','Boss','Director','Executive'], c:0},
            {q:'How do you say "Director"?', o:['Director','Manager','Boss','Executive'], c:0}
        ];

        let preguntasActuales = [];
        let i=0, a=0;

        function cargar() {
            // Seleccionar 20 preguntas aleatorias del banco
            if(preguntasActuales.length === 0) {
                const mezcladas = [...BANCO_PREGUNTAS];
                for (let j = mezcladas.length - 1; j > 0; j--) {
                    const k = Math.floor(Math.random() * (j + 1));
                    [mezcladas[j], mezcladas[k]] = [mezcladas[k], mezcladas[j]];
                }
                preguntasActuales = mezcladas.slice(0, 20);
            }

            if(i>=preguntasActuales.length) {
                clearInterval(timerInterval);
                document.getElementById('pregunta').innerHTML = "🎉 Game Over!";
                document.getElementById('botones').innerHTML = `<h3 style="color:#2d6a4f;">${playerName}, you got ${a} out of ${preguntasActuales.length}</h3>`;
                document.getElementById('respuesta').innerHTML = "";
                document.getElementById('contador').innerHTML = "";
                return;
            }
            const q = preguntasActuales[i];
            document.getElementById('pregunta').innerHTML = q.q;
            document.getElementById('respuesta').innerHTML = "";
            
            let html = "";
            q.o.forEach((opt, idx) => {
                html += `<button class="btn-opcion" onclick="verificar(${idx})">${opt}</button>`;
            });
            document.getElementById('botones').innerHTML = html;
            document.getElementById('contador').innerHTML = `Points: ${a} / ${preguntasActuales.length}`;
        }

        function verificar(idx) {
            const q = preguntasActuales[i];
            const res = document.getElementById('respuesta');
            const btns = document.querySelectorAll('.btn-opcion');
            btns.forEach(b => b.disabled = true);
            
            if(idx === q.c) {
                a++;
                res.innerHTML = "✅ Correct!";
                res.style.color = "#2d6a4f";
            } else {
                res.innerHTML = `❌ Incorrect. It was: ${q.o[q.c]}`;
                res.style.color = "#e74c3c";
            }
            i++;
            document.getElementById('contador').innerHTML = `Points: ${a} / ${preguntasActuales.length}`;
            setTimeout(cargar, 1200);
        }
    </script>
</body>
</html>
