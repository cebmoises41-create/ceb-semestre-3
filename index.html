<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEB Games - Inicio</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilos propios de esta página */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #f2f4f8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        /* Título con degradado */
        .main-title {
            font-size: 4.5rem;
            font-weight: 800;
            margin: 0 0 5px 0;
            color: #1c3d3b;
            background: linear-gradient(135deg, #1c3d3b 30%, #2980b9 80%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #555;
            margin-bottom: 30px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .game-btn {
            border: none;
            border-radius: 12px;
            padding: 20px 5px;
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            background-color: #2d6a4f;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
        }
        .game-btn:hover {
            transform: translateY(-3px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="main-title">CEB GAMES</h1>
        <p class="subtitle">English Learning Games</p>
        <div class="games-grid">
            <!-- ENLACE CORREGIDO: Ya no dice ceb_semester_3/menu.html, solo menu.html -->
            <button class="game-btn" onclick="window.location.href='menu.html'">Entrar al Semestre 3</button>
        </div>
    </div>
</body>
</html>
