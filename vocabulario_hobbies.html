<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hobbies - Vocabulary</title>
    <style>
        body { margin:0; padding:20px; min-height:100vh; display:flex; justify-content:center; align-items:center; font-family:sans-serif; background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%); }
        .floating-words { position:fixed; width:100%; height:100%; top:0; left:0; pointer-events:none; z-index:0; overflow:hidden; }
        .word { position:absolute; color:rgba(52, 152, 219, 0.1); font-weight:900; font-size:5rem; transform:rotate(-15deg); user-select:none; }
        .w1 { top:5%; left:-5%; } .w2 { bottom:5%; right:-5%; } .w3 { top:50%; left:10%; font-size:3rem; }
        
        .game-container { position:relative; z-index:1; background:rgba(255,255,255,0.95); backdrop-filter:blur(5px); padding:40px; border-radius:30px; box-shadow:0 15px 40px rgba(0,0,0,0.1); max-width:650px; width:100%; text-align:center; border:1px solid rgba(255,255,255,0.8); }
        .title { font-size:2.8rem; font-weight:900; color:#1c3d3b; margin:0; }
        .sub { color:#6c757d; margin-bottom:20px; }
        
        /* -- LOGIN -- */
        #login-screen { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px 0; }
        #login-screen input { padding:12px 15px; font-size:1.1rem; border:2px solid #ced4da; border-radius:12px; width:250px; text-align:center; margin:8px 0; outline:none; transition:0.3s; }
        #login-screen input:focus { border-color:#3498db; box-shadow:0 0 0 3px rgba(52,152,219,0.2); }
        #login-screen button { background:#3498db; color:white; border:none; padding:14px 40px; border-radius:30px; font-weight:bold; font-size:1.1rem; cursor:pointer; transition:0.3s; margin-top:15px; box-shadow:0 4px 0 #2176ae; }
        #login-screen button:hover { transform:translateY(-2px); }
        #login-error { color:#e74c3c; font-weight:bold; margin-top:10px; display:none; background:#fde8e8; padding:8px 15px; border-radius:8px; }
        
        /* -- JUEGO -- */
        #game-screen { display:none; }
        .status-bar { display:flex; justify-content:space-between; align-items:center; background:#f8f9fa; padding:10px 20px; border-radius:15px; margin-bottom:20px; border:1px solid #e9ecef; }
        #player-name { font-weight:bold; color:#1c3d3b; font-size:1.1rem; }
        #timer-display { font-weight:bold; color:#c0392b; font-size:1.3rem; background:#fff; padding:5px 15px; border-radius:20px; border:2px solid #c0392b; }
        
        /* PREGUNTA CON EMOJI GRANDE */
        #pregunta {
            font-size: 1.6rem;
            margin: 20px 0;
            color: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        #pregunta .emoji-big {
            font-size: 5rem;
            line-height: 1.2;
            display: block;
            background: #f1f5f9;
            padding: 15px 30px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 300px;
        }
        #pregunta .question-text {
            font-weight: 600;
            font-size: 1.3rem;
            margin-top: 5px;
        }

        .btn-opcion { background: #3498db; color:white; border:none; padding:12px 20px; margin:6px; border-radius:15px; font-weight:bold; cursor:pointer; font-size:1.1rem; transition:0.3s; width:80%; max-width:300px; box-shadow:0 4px 0 #2176ae; }
        .btn-opcion:hover { transform:translateY(-3px); box-shadow:0 6px 0 #2176ae; }
        .btn-opcion:disabled { opacity:0.6; transform:translateY(2px); box-shadow:0 2px 0 #2176ae; cursor:not-allowed; }
        .btn-opcion.correct { background: #28a745; box-shadow:0 4px 0 #1e7e34; }
        .btn-opcion.wrong { background: #dc3545; box-shadow:0 4px 0 #a71d2a; }
        .resultado { font-size:1.2rem; font-weight:bold; margin-top:15px; }
        #contador { font-weight:bold; margin-top:20px; font-size:1.2rem; color:#2980b9; }
        .back-btn { display:inline-block; text-decoration:none; color:#495057; background:#e9ecef; padding:12px 35px; border-radius:30px; font-weight:bold; margin-top:30px; border:1px solid #ced4da; transition:0.3s; }
        .back-btn:hover { background:#ced4da; }
        
        .final-score-box { background:#f8f9fa; padding:20px; border-radius:15px; border:2px solid #3498db; margin-top:20px; display:none; }
        .final-score-box h2 { color:#1c3d3b; margin:0; }
    </style>
</head>
<body>
    <div class="floating-words">
        <div class="word w1">HOBBIES</div> <div class="word w2">SPORTS</div> <div class="word w3">FREE TIME</div>
    </div>

    <div class="game-container">
        <h1 class="title">🎯 Hobbies</h1>
        <p class="sub">Pasatiempos y deportes</p>

        <!-- LOGIN -->
        <div id="login-screen">
            <p style="color:#6c757d; margin-bottom:5px;">Enter your name:</p>
            <input type="text" id="input-name" placeholder="Your name">
            <p style="color:#6c757d; margin-bottom:5px; margin-top:15px;">Enter Access Code:</p>
            <input type="password" id="input-code" placeholder="Code">
            <button onclick="verificarAcceso()">Enter Game</button>
            <p id="login-error">❌ Incorrect code. Try again.</p>
        </div>

        <!-- JUEGO -->
        <div id="game-screen">
            <div class="status-bar">
                <span id="player-name">👋 Welcome, Student!</span>
                <span id="timer-display">⏱️ 100s</span>
            </div>
            <div id="pregunta-container">
                <div id="pregunta">Loading...</div>
                <div id="botones"></div>
            </div>
            <p class="resultado" id="respuesta"></p>
            <p id="contador">Points: 0 / 20</p>
            <div class="final-score-box" id="score-box">
                <h2>🎉 Completed!</h2>
                <p id="final-message" style="font-size:1.3rem; font-weight:bold;"></p>
            </div>
            <a href="menu.html" class="back-btn">← Back to Menu</a>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. SISTEMA DE CÓDIGOS DINÁMICOS (3 INTENTOS)
        // ============================================================
        const getCorrectCode = () => {
            let count = parseInt(localStorage.getItem('hobbies_attempts')) || 0;
            return count >= 3 ? "9999" : "2025";
        };

        let playerName = "Student";
        let timerInterval;
        let timeLeft = 100;
        let juegoTerminado = false;

        // ============================================================
        // 2. BANCO DE 40 PREGUNTAS - HOBBIES & SPORTS
        // ============================================================
        const BANCO_PREGUNTAS = [
            {q:'🏊', t:'What hobby is this?', o:['Swimming','Diving','Surfing','Sailing'], c:0},
            {q:'🏃', t:'What hobby is this?', o:['Walking','Running','Jumping','Dancing'], c:1},
            {q:'🎸', t:'What hobby is this?', o:['Piano','Drums','Violin','Guitar'], c:3},
            {q:'📚', t:'What hobby is this?', o:['Writing','Drawing','Reading','Singing'], c:2},
            {q:'🎨', t:'What hobby is this?', o:['Painting','Sculpting','Drawing','Photography'], c:0},
            {q:'⚽', t:'What hobby is this?', o:['Tennis','Basketball','Soccer','Volleyball'], c:2},
            {q:'🎮', t:'What hobby is this?', o:['Reading','Video Games','Chess','Puzzles'], c:1},
            {q:'🏀', t:'What hobby is this?', o:['Soccer','Tennis','Basketball','Baseball'], c:2},
            {q:'🎵', t:'What hobby is this?', o:['Singing','Dancing','Music','Acting'], c:2},
            {q:'🚴', t:'What hobby is this?', o:['Running','Swimming','Cycling','Walking'], c:2},
            {q:'🎬', t:'What hobby is this?', o:['Theater','Movies','Music','Dance'], c:0},
            {q:'📸', t:'What hobby is this?', o:['Drawing','Painting','Photography','Design'], c:2},
            {q:'🏋️', t:'What hobby is this?', o:['Yoga','Weightlifting','Running','Swimming'], c:1},
            {q:'🎾', t:'What hobby is this?', o:['Badminton','Tennis','Squash','Ping Pong'], c:1},
            {q:'⛰️', t:'What hobby is this?', o:['Hiking','Skiing','Snowboarding','Climbing'], c:0},
            {q:'🎭', t:'What hobby is this?', o:['Dance','Theater','Music','Singing'], c:1},
            {q:'🏐', t:'What hobby is this?', o:['Basketball','Volleyball','Soccer','Tennis'], c:1},
            {q:'🏸', t:'What hobby is this?', o:['Tennis','Badminton','Squash','Ping Pong'], c:1},
            {q:'🏓', t:'What hobby is this?', o:['Tennis','Badminton','Ping Pong','Squash'], c:2},
            {q:'⛸️', t:'What hobby is this?', o:['Skating','Skiing','Snowboarding','Surfing'], c:0},
            {q:'🏹', t:'What hobby is this?', o:['Archery','Shooting','Hunting','Fencing'], c:0},
            {q:'🥋', t:'What hobby is this?', o:['Boxing','Karate','Judo','Taekwondo'], c:1},
            {q:'🏇', t:'What hobby is this?', o:['Running','Horseback Riding','Cycling','Walking'], c:1},
            {q:'🎪', t:'What hobby is this?', o:['Circus','Theater','Acrobatics','Dance'], c:2},
            {q:'🎲', t:'What hobby is this?', o:['Poker','Chess','Board Games','Cards'], c:2},
            {q:'🧩', t:'What hobby is this?', o:['Puzzles','Crosswords','Sudoku','Games'], c:0},
            {q:'🎤', t:'What hobby is this?', o:['Singing','Rapping','DJ','Podcast'], c:0},
            {q:'🪁', t:'What hobby is this?', o:['Flying Kites','Paragliding','Surfing','Sailing'], c:0},
            {q:'🥾', t:'What hobby is this?', o:['Running','Hiking','Walking','Trekking'], c:1},
            {q:'🧘', t:'What hobby is this?', o:['Yoga','Meditation','Pilates','Stretching'], c:0},
            {q:'🏄', t:'What hobby is this?', o:['Swimming','Surfing','Sailing','Diving'], c:1},
            {q:'🚣', t:'What hobby is this?', o:['Sailing','Rowing','Kayaking','Swimming'], c:1},
            {q:'🎯', t:'What hobby is this?', o:['Archery','Darts','Shooting','Target Practice'], c:1},
            {q:'🪂', t:'What hobby is this?', o:['Skydiving','Paragliding','Bungee','Gliding'], c:1},
            {q:'🏂', t:'What hobby is this?', o:['Skiing','Snowboarding','Skating','Surfing'], c:1},
            {q:'🛹', t:'What hobby is this?', o:['Skateboarding','Rollerblading','Scooter','Skating'], c:0},
            {q:'🎺', t:'What hobby is this?', o:['Trumpet','Saxophone','Trombone','Flute'], c:0},
            {q:'🪕', t:'What hobby is this?', o:['Guitar','Banjo','Ukulele','Mandolin'], c:1},
            {q:'🥁', t:'What hobby is this?', o:['Drums','Percussion','Tambourine','Maracas'], c:0},
            {q:'🎹', t:'What hobby is this?', o:['Piano','Keyboard','Synthesizer','Organ'], c:0}
        ];

        // ============================================================
        // 3. VARIABLES GLOBALES
        // ============================================================
        let preguntasActuales = [];
        let indiceActual = 0;
        let puntaje = 0;

        // ============================================================
        // 4. LOGIN
        // ============================================================
        function verificarAcceso() {
            const nameInput = document.getElementById('input-name').value.trim();
            const codeInput = document.getElementById('input-code').value.trim();
            const errorMsg = document.getElementById('login-error');

            if(nameInput === "") { alert("Please enter your name."); return; }
            
            const requiredCode = getCorrectCode();
            if(codeInput !== requiredCode) {
                errorMsg.style.display = "block";
                document.getElementById('input-code').value = "";
                return;
            }

            let count = parseInt(localStorage.getItem('hobbies_attempts')) || 0;
            localStorage.setItem('hobbies_attempts', count + 1);

            errorMsg.style.display = "none";
            playerName = nameInput;
            document.getElementById('login-screen').style.display = "none";
            document.getElementById('game-screen').style.display = "block";
            document.getElementById('player-name').innerHTML = `👋 Welcome, ${playerName}!`;
            iniciarJuego();
        }

        // ============================================================
        // 5. INICIO DEL JUEGO
        // ============================================================
        function iniciarJuego() {
            juegoTerminado = false;
            indiceActual = 0;
            puntaje = 0;

            const mezcladas = [...BANCO_PREGUNTAS].sort(() => Math.random() - 0.5);
            preguntasActuales = mezcladas.slice(0, 20);

            document.getElementById('score-box').style.display = 'none';
            document.getElementById('contador').style.display = 'block';
            document.getElementById('contador').innerHTML = `Points: 0 / 20`;
            document.getElementById('respuesta').innerHTML = '';

            iniciarCronometro();
            mostrarPregunta();
        }

        // ============================================================
        // 6. CRONÓMETRO (100 SEGUNDOS)
        // ============================================================
        function iniciarCronometro() {
            timeLeft = 100;
            document.getElementById('timer-display').innerHTML = `⏱️ ${timeLeft}s`;
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-display').innerHTML = `⏱️ ${timeLeft}s`;
                if(timeLeft <= 0 && !juegoTerminado) {
                    clearInterval(timerInterval);
                    finalizarJuego("⏰ Time's Up!");
                }
            }, 1000);
        }

        // ============================================================
        // 7. MOSTRAR PREGUNTA CON EMOJI GRANDE
        // ============================================================
        function mostrarPregunta() {
            if (juegoTerminado) return;
            
            if (indiceActual >= preguntasActuales.length) {
                finalizarJuego("🎉 Completed!");
                return;
            }

            const q = preguntasActuales[indiceActual];
            
            // Mostrar emoji grande y texto
            document.getElementById('pregunta').innerHTML = `
                <span class="emoji-big">${q.q}</span>
                <span class="question-text">${q.t}</span>
            `;
            
            document.getElementById('respuesta').innerHTML = "";
            document.getElementById('contador').innerHTML = `Points: ${puntaje} / ${preguntasActuales.length}`;

            let html = "";
            q.o.forEach((opt, idx) => {
                html += `<button class="btn-opcion" onclick="verificar(${idx})">${opt}</button>`;
            });
            document.getElementById('botones').innerHTML = html;
        }

        // ============================================================
        // 8. VERIFICAR RESPUESTA
        // ============================================================
        function verificar(idx) {
            if (juegoTerminado) return;
            
            const q = preguntasActuales[indiceActual];
            const res = document.getElementById('respuesta');
            const btns = document.querySelectorAll('.btn-opcion');
            btns.forEach(b => b.disabled = true);

            btns.forEach((btn, i) => {
                if (i === q.c) {
                    btn.classList.add('correct');
                } else if (i === idx && idx !== q.c) {
                    btn.classList.add('wrong');
                }
            });
            
            if (idx === q.c) {
                puntaje++;
                res.innerHTML = "✅ Correct!";
                res.style.color = "#28a745";
            } else {
                res.innerHTML = `❌ Incorrect. It was: "${q.o[q.c]}"`;
                res.style.color = "#dc3545";
            }
            
            indiceActual++;
            document.getElementById('contador').innerHTML = `Points: ${puntaje} / ${preguntasActuales.length}`;
            
            setTimeout(mostrarPregunta, 1200);
        }

        // ============================================================
        // 9. FINALIZAR JUEGO
        // ============================================================
        function finalizarJuego(mensaje) {
            if (juegoTerminado) return;
            juegoTerminado = true;
            clearInterval(timerInterval);

            document.querySelectorAll('.btn-opcion').forEach(b => b.disabled = true);

            localStorage.setItem('hobbies_score', puntaje);
            
            let history = JSON.parse(localStorage.getItem('hobbies_history')) || [];
            history.push({
                name: playerName,
                score: puntaje,
                total: preguntasActuales.length,
                date: new Date().toISOString().slice(0, 10),
                game: 'Hobbies'
            });
            localStorage.setItem('hobbies_history', JSON.stringify(history));

            document.getElementById('score-box').style.display = 'block';
            document.getElementById('final-message').innerHTML = 
                `${mensaje}<br>${playerName}, you got <span style="color:#3498db; font-size:2rem;">${puntaje}</span> out of ${preguntasActuales.length} correct!`;
            
            document.getElementById('contador').style.display = 'none';
            document.getElementById('respuesta').innerHTML = '';
            document.getElementById('pregunta').innerHTML = '🏁 Game Finished!';
            document.getElementById('botones').innerHTML = '';
        }

        // ============================================================
        // 10. PERMITIR ENTER EN LOGIN
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const loginScreen = document.getElementById('login-screen');
                if (loginScreen.style.display !== 'none') {
                    verificarAcceso();
                }
            }
        });
    </script>
</body>
</html>
