<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Irregular Verbs 2 - Past Participle</title>
    <style>
        body { margin:0; padding:20px; min-height:100vh; display:flex; justify-content:center; align-items:center; font-family:sans-serif; background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%); }
        .floating-words { position:fixed; width:100%; height:100%; top:0; left:0; pointer-events:none; z-index:0; overflow:hidden; }
        .word { position:absolute; color:rgba(231, 76, 60, 0.08); font-weight:900; font-size:5rem; transform:rotate(-15deg); user-select:none; }
        .w1 { top:5%; left:-5%; } .w2 { bottom:5%; right:-5%; } .w3 { top:50%; left:10%; font-size:3rem; }
        
        .game-container { position:relative; z-index:1; background:rgba(255,255,255,0.95); backdrop-filter:blur(5px); padding:40px; border-radius:30px; box-shadow:0 15px 40px rgba(0,0,0,0.1); max-width:700px; width:100%; text-align:center; border:1px solid rgba(255,255,255,0.8); }
        .title { font-size:2.8rem; font-weight:900; color:#1c3d3b; margin:0; }
        .sub { color:#6c757d; margin-bottom:20px; }
        
        /* -- LOGIN -- */
        #login-screen { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px 0; }
        #login-screen input { padding:12px 15px; font-size:1.1rem; border:2px solid #ced4da; border-radius:12px; width:250px; text-align:center; margin:8px 0; outline:none; transition:0.3s; }
        #login-screen input:focus { border-color:#e74c3c; box-shadow:0 0 0 3px rgba(231,76,60,0.2); }
        #login-screen button { background:#e74c3c; color:white; border:none; padding:14px 40px; border-radius:30px; font-weight:bold; font-size:1.1rem; cursor:pointer; transition:0.3s; margin-top:15px; box-shadow:0 4px 0 #c0392b; }
        #login-screen button:hover { transform:translateY(-2px); }
        #login-error { color:#e74c3c; font-weight:bold; margin-top:10px; display:none; background:#fde8e8; padding:8px 15px; border-radius:8px; }
        
        /* -- JUEGO -- */
        #game-screen { display:none; }
        .status-bar { display:flex; justify-content:space-between; align-items:center; background:#f8f9fa; padding:10px 20px; border-radius:15px; margin-bottom:20px; border:1px solid #e9ecef; flex-wrap:wrap; gap:10px; }
        #player-name { font-weight:bold; color:#1c3d3b; font-size:1.1rem; }
        #timer-display { font-weight:bold; color:#c0392b; font-size:1.3rem; background:#fff; padding:5px 15px; border-radius:20px; border:2px solid #c0392b; }
        
        /* PREGUNTA */
        #pregunta-container {
            background: #f8f9fa;
            border-radius: 20px;
            padding: 30px 25px;
            margin-bottom: 20px;
        }
        #pregunta {
            font-size: 1.6rem;
            margin: 10px 0;
            color: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        #pregunta .verb-display {
            font-size: 2.5rem;
            font-weight: 900;
            color: #e74c3c;
            background: #fff;
            padding: 10px 30px;
            border-radius: 15px;
            display: inline-block;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        #pregunta .verb-display .infinitive {
            color: #2c3e50;
            font-size: 1.8rem;
        }
        #pregunta .verb-display .tense {
            color: #e74c3c;
            font-size: 1.2rem;
            font-weight: 600;
        }
        #pregunta .emoji-big {
            font-size: 4rem;
            line-height: 1.2;
            display: block;
            background: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 120px;
        }
        #pregunta .sentence {
            font-size: 1.4rem;
            font-weight: 600;
            color: #1c3d3b;
            background: #fff;
            padding: 15px 25px;
            border-radius: 15px;
            width: 100%;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        #pregunta .sentence .blank {
            display: inline-block;
            min-width: 100px;
            border-bottom: 4px dashed #e74c3c;
            color: #e74c3c;
            font-weight: 900;
            padding: 0 8px;
        }
        #pregunta .sentence .hint {
            font-size: 0.9rem;
            color: #6c757d;
            font-weight: 400;
        }
        #pregunta .instruction-text {
            font-weight: 600;
            font-size: 1rem;
            color: #6c757d;
        }

        /* OPCIONES */
        .btn-opcion {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 14px 20px;
            margin: 8px;
            border-radius: 15px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.3s;
            width: 85%;
            max-width: 350px;
            box-shadow: 0 4px 0 #c0392b;
            text-align: center;
        }
        .btn-opcion:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 0 #c0392b;
        }
        .btn-opcion:disabled {
            opacity: 0.6;
            transform: translateY(2px);
            box-shadow: 0 2px 0 #c0392b;
            cursor: not-allowed;
        }
        .btn-opcion.correct {
            background: #28a745;
            box-shadow: 0 4px 0 #1e7e34;
        }
        .btn-opcion.wrong {
            background: #dc3545;
            box-shadow: 0 4px 0 #a71d2a;
        }
        .resultado {
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 15px;
            min-height: 40px;
        }
        #contador {
            font-weight: bold;
            margin-top: 20px;
            font-size: 1.2rem;
            color: #2980b9;
        }
        .back-btn {
            display: inline-block;
            text-decoration: none;
            color: #495057;
            background: #e9ecef;
            padding: 12px 35px;
            border-radius: 30px;
            font-weight: bold;
            margin-top: 30px;
            border: 1px solid #ced4da;
            transition: 0.3s;
        }
        .back-btn:hover {
            background: #ced4da;
        }
        
        .final-score-box {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            border: 2px solid #e74c3c;
            margin-top: 20px;
            display: none;
        }
        .final-score-box h2 {
            color: #1c3d3b;
            margin: 0;
        }

        @media (max-width: 600px) {
            .game-container { padding: 20px; }
            #pregunta .emoji-big { font-size: 3rem; max-width: 100px; }
            #pregunta .sentence { font-size: 1.1rem; padding: 12px 15px; }
            #pregunta .verb-display { font-size: 2rem; }
            .btn-opcion { width: 95%; font-size: 0.95rem; padding: 12px 15px; }
            .status-bar { flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>
    <div class="floating-words">
        <div class="word w1">IRREGULAR</div>
        <div class="word w2">VERBS</div>
        <div class="word w3">PARTICIPLE</div>
    </div>

    <div class="game-container">
        <h1 class="title">🔄 Irregular Verbs 2</h1>
        <p class="sub">Choose the correct past participle</p>

        <!-- LOGIN -->
        <div id="login-screen">
            <p style="color:#6c757d; margin-bottom:5px;">Enter your name:</p>
            <input type="text" id="input-name" placeholder="Your name">
            <p style="color:#6c757d; margin-bottom:5px; margin-top:15px;">Enter Access Code:</p>
            <input type="password" id="input-code" placeholder="Code">
            <button onclick="verificarAcceso()">Enter Game</button>
            <p id="login-error">❌ Incorrect code. Try again.</p>
        </div>

        <!-- JUEGO -->
        <div id="game-screen">
            <div class="status-bar">
                <span id="player-name">👋 Welcome, Student!</span>
                <span id="timer-display">⏱️ 100s</span>
            </div>

            <div id="pregunta-container">
                <div id="pregunta">Loading...</div>
                <div id="botones"></div>
            </div>

            <p class="resultado" id="respuesta"></p>
            <p id="contador">Points: 0 / 20</p>

            <div class="final-score-box" id="score-box">
                <h2>🎉 Completed!</h2>
                <p id="final-message" style="font-size:1.3rem; font-weight:bold;"></p>
            </div>
            <a href="menu.html" class="back-btn">← Back to Menu</a>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. SISTEMA DE CÓDIGOS DINÁMICOS (3 INTENTOS)
        // ============================================================
        const getCorrectCode = () => {
            let count = parseInt(localStorage.getItem('verbs2_attempts')) || 0;
            return count >= 3 ? "9999" : "138";
        };

        let playerName = "Student";
        let timerInterval;
        let timeLeft = 100;
        let juegoTerminado = false;

        // ============================================================
        // 2. BANCO DE 40 PREGUNTAS - IRREGULAR VERBS 2 (PAST PARTICIPLE)
        // ============================================================
        const BANCO_PREGUNTAS = [
            // be
            { emoji: '😊', verb: 'be', sentence: 'I have ______ to Paris many times.', correct: 'been', wrong: ['was', 'were', 'being'] },
            // eat
            { emoji: '🍕', verb: 'eat', sentence: 'I have ______ all the pizza.', correct: 'eaten', wrong: ['ate', 'eat', 'eating'] },
            // drink
            { emoji: '☕', verb: 'drink', sentence: 'She has ______ three cups of coffee today.', correct: 'drunk', wrong: ['drank', 'drink', 'drinking'] },
            // see
            { emoji: '👀', verb: 'see', sentence: 'I have ______ that movie before.', correct: 'seen', wrong: ['saw', 'see', 'seeing'] },
            // take
            { emoji: '📸', verb: 'take', sentence: 'We have ______ many photos.', correct: 'taken', wrong: ['took', 'take', 'taking'] },
            // have
            { emoji: '🍳', verb: 'have', sentence: 'I have ______ breakfast already.', correct: 'had', wrong: ['have', 'has', 'having'] },
            // make
            { emoji: '🎨', verb: 'make', sentence: 'My mom has ______ a delicious cake.', correct: 'made', wrong: ['make', 'making', 'makes'] },
            // do
            { emoji: '💪', verb: 'do', sentence: 'I have ______ my homework.', correct: 'done', wrong: ['did', 'do', 'doing'] },
            // say
            { emoji: '🗣️', verb: 'say', sentence: 'He has ______ hello to everyone.', correct: 'said', wrong: ['say', 'says', 'saying'] },
            // get
            { emoji: '🎁', verb: 'get', sentence: 'I have ______ a new phone.', correct: 'gotten', wrong: ['got', 'get', 'getting'] },
            // buy
            { emoji: '🛍️', verb: 'buy', sentence: 'She has ______ a new dress.', correct: 'bought', wrong: ['buy', 'buying', 'buys'] },
            // come
            { emoji: '🚶', verb: 'come', sentence: 'They have ______ to the party.', correct: 'come', wrong: ['came', 'coming', 'comes'] },
            // give
            { emoji: '🎁', verb: 'give', sentence: 'My father has ______ me a gift.', correct: 'given', wrong: ['gave', 'give', 'giving'] },
            // know
            { emoji: '🧠', verb: 'know', sentence: 'I have ______ her for years.', correct: 'known', wrong: ['knew', 'know', 'knows'] },
            // think
            { emoji: '🤔', verb: 'think', sentence: 'I have ______ about it a lot.', correct: 'thought', wrong: ['think', 'thinking', 'thinks'] },
            // read
            { emoji: '📖', verb: 'read', sentence: 'I have ______ three books this month.', correct: 'read', wrong: ['reads', 'reading', 'red'] },
            // write
            { emoji: '✍️', verb: 'write', sentence: 'She has ______ a letter to her friend.', correct: 'written', wrong: ['wrote', 'write', 'writing'] },
            // speak
            { emoji: '💬', verb: 'speak', sentence: 'He has ______ to the teacher.', correct: 'spoken', wrong: ['spoke', 'speak', 'speaking'] },
            // break
            { emoji: '💔', verb: 'break', sentence: 'I have ______ my phone screen.', correct: 'broken', wrong: ['broke', 'break', 'breaking'] },
            // choose
            { emoji: '👆', verb: 'choose', sentence: 'I have ______ the red one.', correct: 'chosen', wrong: ['chose', 'choose', 'choosing'] },
            // drive
            { emoji: '🚗', verb: 'drive', sentence: 'My dad has ______ us to the airport.', correct: 'driven', wrong: ['drove', 'drive', 'driving'] },
            // fly
            { emoji: '✈️', verb: 'fly', sentence: 'We have ______ to Paris before.', correct: 'flown', wrong: ['flew', 'fly', 'flying'] },
            // forget
            { emoji: '😅', verb: 'forget', sentence: 'I have ______ my keys at home.', correct: 'forgotten', wrong: ['forgot', 'forget', 'forgetting'] },
            // grow
            { emoji: '🌱', verb: 'grow', sentence: 'The plant has ______ very fast.', correct: 'grown', wrong: ['grew', 'grow', 'growing'] },
            // hide
            { emoji: '🙈', verb: 'hide', sentence: 'The boy has ______ behind the door.', correct: 'hidden', wrong: ['hid', 'hide', 'hiding'] },
            // keep
            { emoji: '🔐', verb: 'keep', sentence: 'I have ______ the money in a safe.', correct: 'kept', wrong: ['keep', 'keeping', 'keeps'] },
            // leave
            { emoji: '🚪', verb: 'leave', sentence: 'She has ______ the party.', correct: 'left', wrong: ['leave', 'leaving', 'leaves'] },
            // lose
            { emoji: '😢', verb: 'lose', sentence: 'I have ______ my wallet.', correct: 'lost', wrong: ['lose', 'losing', 'loses'] },
            // mean
            { emoji: '📖', verb: 'mean', sentence: 'I have ______ what I said.', correct: 'meant', wrong: ['mean', 'meaning', 'means'] },
            // pay
            { emoji: '💰', verb: 'pay', sentence: 'I have ______ for the dinner.', correct: 'paid', wrong: ['pay', 'paying', 'pays'] },
            // run
            { emoji: '🏃', verb: 'run', sentence: 'He has ______ in many marathons.', correct: 'run', wrong: ['ran', 'running', 'runs'] },
            // send
            { emoji: '📩', verb: 'send', sentence: 'I have ______ an email to my teacher.', correct: 'sent', wrong: ['send', 'sending', 'sends'] },
            // sing
            { emoji: '🎤', verb: 'sing', sentence: 'She has ______ at many concerts.', correct: 'sung', wrong: ['sang', 'sing', 'singing'] },
            // sleep
            { emoji: '😴', verb: 'sleep', sentence: 'I have ______ for 8 hours.', correct: 'slept', wrong: ['sleep', 'sleeping', 'sleeps'] },
            // swim
            { emoji: '🏊', verb: 'swim', sentence: 'We have ______ in the ocean.', correct: 'swum', wrong: ['swam', 'swim', 'swimming'] },
            // tell
            { emoji: '🗣️', verb: 'tell', sentence: 'I have ______ him the truth.', correct: 'told', wrong: ['tell', 'telling', 'tells'] },
            // wear
            { emoji: '👕', verb: 'wear', sentence: 'She has ______ a beautiful dress.', correct: 'worn', wrong: ['wore', 'wear', 'wearing'] },
            // win
            { emoji: '🏆', verb: 'win', sentence: 'Our team has ______ the championship.', correct: 'won', wrong: ['win', 'winning', 'wins'] },
            // throw
            { emoji: '⚾', verb: 'throw', sentence: 'I have ______ the ball to my friend.', correct: 'thrown', wrong: ['threw', 'throw', 'throwing'] },
            // understand
            { emoji: '🧠', verb: 'understand', sentence: 'I have ______ the lesson perfectly.', correct: 'understood', wrong: ['understand', 'understanding', 'understands'] }
        ];

        // ============================================================
        // 3. VARIABLES GLOBALES
        // ============================================================
        let preguntasActuales = [];
        let indiceActual = 0;
        let puntaje = 0;

        // ============================================================
        // 4. LOGIN
        // ============================================================
        function verificarAcceso() {
            const nameInput = document.getElementById('input-name').value.trim();
            const codeInput = document.getElementById('input-code').value.trim();
            const errorMsg = document.getElementById('login-error');

            if (nameInput === "") { alert("Please enter your name."); return; }

            const requiredCode = getCorrectCode();
            if (codeInput !== requiredCode) {
                errorMsg.style.display = "block";
                document.getElementById('input-code').value = "";
                return;
            }

            let count = parseInt(localStorage.getItem('verbs2_attempts')) || 0;
            localStorage.setItem('verbs2_attempts', count + 1);

            errorMsg.style.display = "none";
            playerName = nameInput;
            document.getElementById('login-screen').style.display = "none";
            document.getElementById('game-screen').style.display = "block";
            document.getElementById('player-name').innerHTML = `👋 Welcome, ${playerName}!`;
            iniciarJuego();
        }

        // ============================================================
        // 5. INICIO DEL JUEGO
        // ============================================================
        function iniciarJuego() {
            juegoTerminado = false;
            indiceActual = 0;
            puntaje = 0;

            const mezcladas = [...BANCO_PREGUNTAS].sort(() => Math.random() - 0.5);
            preguntasActuales = mezcladas.slice(0, 20);

            document.getElementById('score-box').style.display = 'none';
            document.getElementById('contador').style.display = 'block';
            document.getElementById('contador').innerHTML = `Points: 0 / 20`;
            document.getElementById('respuesta').innerHTML = '';

            iniciarCronometro();
            mostrarPregunta();
        }

        // ============================================================
        // 6. CRONÓMETRO (100 SEGUNDOS)
        // ============================================================
        function iniciarCronometro() {
            timeLeft = 100;
            document.getElementById('timer-display').innerHTML = `⏱️ ${timeLeft}s`;
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-display').innerHTML = `⏱️ ${timeLeft}s`;
                if (timeLeft <= 0 && !juegoTerminado) {
                    clearInterval(timerInterval);
                    finalizarJuego("⏰ Time's Up!");
                }
            }, 1000);
        }

        // ============================================================
        // 7. MOSTRAR PREGUNTA
        // ============================================================
        function mostrarPregunta() {
            if (juegoTerminado) return;

            if (indiceActual >= preguntasActuales.length) {
                finalizarJuego("🎉 Completed!");
                return;
            }

            const q = preguntasActuales[indiceActual];
            
            // Mezclar opciones
            const opciones = [q.correct, ...q.wrong];
            const mezcladas = opciones.sort(() => Math.random() - 0.5);
            const indiceCorrecta = mezcladas.indexOf(q.correct);

            // Mostrar pregunta
            document.getElementById('pregunta').innerHTML = `
                <span class="emoji-big">${q.emoji}</span>
                <div class="verb-display">
                    <span class="infinitive">${q.verb}</span>
                    <span class="tense"> → Past Participle</span>
                </div>
                <span class="sentence">
                    ${q.sentence.replace('______', '<span class="blank">______</span>')}
                </span>
                <span class="instruction-text">✏️ Choose the correct past participle:</span>
            `;

            document.getElementById('respuesta').innerHTML = "";
            document.getElementById('contador').innerHTML = `Points: ${puntaje} / ${preguntasActuales.length}`;

            // Generar botones de opciones
            let html = "";
            mezcladas.forEach((opt, idx) => {
                const isCorrect = idx === indiceCorrecta;
                html += `<button class="btn-opcion" onclick="verificar(${idx}, ${isCorrect})" data-correct="${isCorrect}">${opt}</button>`;
            });
            document.getElementById('botones').innerHTML = html;
        }

        // ============================================================
        // 8. VERIFICAR RESPUESTA
        // ============================================================
        function verificar(idx, isCorrect) {
            if (juegoTerminado) return;

            const btns = document.querySelectorAll('.btn-opcion');
            btns.forEach(b => b.disabled = true);

            btns.forEach((btn, i) => {
                const correct = btn.dataset.correct === 'true';
                if (correct) {
                    btn.classList.add('correct');
                } else if (i === idx && !isCorrect) {
                    btn.classList.add('wrong');
                }
            });

            const res = document.getElementById('respuesta');
            if (isCorrect) {
                puntaje++;
                res.innerHTML = "✅ Correct! Well done!";
                res.style.color = "#28a745";
            } else {
                let correctText = '';
                btns.forEach(btn => {
                    if (btn.dataset.correct === 'true') {
                        correctText = btn.textContent.trim();
                    }
                });
                res.innerHTML = `❌ Incorrect. The correct past participle is: "${correctText}"`;
                res.style.color = "#dc3545";
            }

            indiceActual++;
            document.getElementById('contador').innerHTML = `Points: ${puntaje} / ${preguntasActuales.length}`;

            setTimeout(mostrarPregunta, 1500);
        }

        // ============================================================
        // 9. FINALIZAR JUEGO
        // ============================================================
        function finalizarJuego(mensaje) {
            if (juegoTerminado) return;
            juegoTerminado = true;
            clearInterval(timerInterval);

            document.querySelectorAll('.btn-opcion').forEach(b => b.disabled = true);

            localStorage.setItem('verbs2_score', puntaje);

            let history = JSON.parse(localStorage.getItem('verbs2_history')) || [];
            history.push({
                name: playerName,
                score: puntaje,
                total: preguntasActuales.length,
                date: new Date().toISOString().slice(0, 10),
                game: 'Irregular Verbs 2'
            });
            localStorage.setItem('verbs2_history', JSON.stringify(history));

            document.getElementById('score-box').style.display = 'block';
            document.getElementById('final-message').innerHTML =
                `${mensaje}<br>${playerName}, you got <span style="color:#e74c3c; font-size:2rem;">${puntaje}</span> out of ${preguntasActuales.length} correct!`;

            document.getElementById('contador').style.display = 'none';
            document.getElementById('respuesta').innerHTML = '';
            document.getElementById('pregunta').innerHTML = '🏁 Game Finished!';
            document.getElementById('botones').innerHTML = '';
        }

        // ============================================================
        // 10. PERMITIR ENTER EN LOGIN
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const loginScreen = document.getElementById('login-screen');
                if (loginScreen.style.display !== 'none') {
                    verificarAcceso();
                }
            }
        });
    </script>
</body>
</html>
