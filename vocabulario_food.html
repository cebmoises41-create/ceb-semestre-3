<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food - Listening</title>
    <style>
        body { margin:0; padding:20px; min-height:100vh; display:flex; justify-content:center; align-items:center; font-family:sans-serif; background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%); }
        .floating-words { position:fixed; width:100%; height:100%; top:0; left:0; pointer-events:none; z-index:0; overflow:hidden; }
        .word { position:absolute; color:rgba(231, 76, 60, 0.08); font-weight:900; font-size:5rem; transform:rotate(-15deg); user-select:none; }
        .w1 { top:5%; left:-5%; } .w2 { bottom:5%; right:-5%; } .w3 { top:50%; left:10%; font-size:3rem; }
        
        .game-container { position:relative; z-index:1; background:rgba(255,255,255,0.95); backdrop-filter:blur(5px); padding:40px; border-radius:30px; box-shadow:0 15px 40px rgba(0,0,0,0.1); max-width:700px; width:100%; text-align:center; border:1px solid rgba(255,255,255,0.8); }
        .title { font-size:2.8rem; font-weight:900; color:#1c3d3b; margin:0; }
        .sub { color:#6c757d; margin-bottom:20px; }
        
        /* -- LOGIN -- */
        #login-screen { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px 0; }
        #login-screen input { padding:12px 15px; font-size:1.1rem; border:2px solid #ced4da; border-radius:12px; width:250px; text-align:center; margin:8px 0; outline:none; transition:0.3s; }
        #login-screen input:focus { border-color:#e74c3c; box-shadow:0 0 0 3px rgba(231,76,60,0.2); }
        #login-screen button { background:#e74c3c; color:white; border:none; padding:14px 40px; border-radius:30px; font-weight:bold; font-size:1.1rem; cursor:pointer; transition:0.3s; margin-top:15px; box-shadow:0 4px 0 #c0392b; }
        #login-screen button:hover { transform:translateY(-2px); }
        #login-error { color:#e74c3c; font-weight:bold; margin-top:10px; display:none; background:#fde8e8; padding:8px 15px; border-radius:8px; }
        
        /* -- JUEGO -- */
        #game-screen { display:none; }
        .status-bar { display:flex; justify-content:space-between; align-items:center; background:#f8f9fa; padding:10px 20px; border-radius:15px; margin-bottom:20px; border:1px solid #e9ecef; flex-wrap:wrap; gap:10px; }
        #player-name { font-weight:bold; color:#1c3d3b; font-size:1.1rem; }
        #timer-display { font-weight:bold; color:#c0392b; font-size:1.3rem; background:#fff; padding:5px 15px; border-radius:20px; border:2px solid #c0392b; }
        
        /* PREGUNTA */
        #pregunta-container {
            background: #f8f9fa;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
        }
        #pregunta {
            font-size: 1.6rem;
            margin: 10px 0;
            color: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        #pregunta .emoji-big {
            font-size: 5rem;
            line-height: 1.2;
            display: block;
            background: #fff;
            padding: 15px 30px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 200px;
        }
        #pregunta .instruction-text {
            font-weight: 600;
            font-size: 1.1rem;
            color: #6c757d;
        }
        #pregunta .key-word {
            font-weight: 900;
            font-size: 2rem;
            color: #e74c3c;
            background: #fff;
            padding: 8px 25px;
            border-radius: 15px;
            border: 3px dashed #e74c3c;
            display: inline-block;
        }

        /* BOTÓN DE AUDIO */
        .audio-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 15px 35px;
            border-radius: 50px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 0 #c0392b;
            margin: 10px 0;
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }
        .audio-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 0 #c0392b;
        }
        .audio-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #c0392b;
        }
        .audio-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .audio-btn .speaker {
            font-size: 2rem;
        }

        /* OPCIONES */
        .btn-opcion {
            background: #3498db;
            color: white;
            border: none;
            padding: 14px 20px;
            margin: 8px;
            border-radius: 15px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.3s;
            width: 85%;
            max-width: 350px;
            box-shadow: 0 4px 0 #2176ae;
            text-align: left;
            padding-left: 25px;
        }
        .btn-opcion:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 0 #2176ae;
        }
        .btn-opcion:disabled {
            opacity: 0.6;
            transform: translateY(2px);
            box-shadow: 0 2px 0 #2176ae;
            cursor: not-allowed;
        }
        .btn-opcion.correct {
            background: #28a745;
            box-shadow: 0 4px 0 #1e7e34;
        }
        .btn-opcion.wrong {
            background: #dc3545;
            box-shadow: 0 4px 0 #a71d2a;
        }
        .btn-opcion .highlight {
            font-weight: 900;
            color: #ffe082;
            text-decoration: underline;
        }
        .resultado {
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 15px;
            min-height: 40px;
        }
        #contador {
            font-weight: bold;
            margin-top: 20px;
            font-size: 1.2rem;
            color: #2980b9;
        }
        .back-btn {
            display: inline-block;
            text-decoration: none;
            color: #495057;
            background: #e9ecef;
            padding: 12px 35px;
            border-radius: 30px;
            font-weight: bold;
            margin-top: 30px;
            border: 1px solid #ced4da;
            transition: 0.3s;
        }
        .back-btn:hover {
            background: #ced4da;
        }
        
        .final-score-box {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            border: 2px solid #e74c3c;
            margin-top: 20px;
            display: none;
        }
        .final-score-box h2 {
            color: #1c3d3b;
            margin: 0;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .game-container { padding: 20px; }
            #pregunta .emoji-big { font-size: 3.5rem; max-width: 150px; }
            .btn-opcion { width: 95%; font-size: 0.95rem; padding: 12px 15px; }
            .audio-btn { font-size: 1.2rem; padding: 12px 25px; }
            .status-bar { flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>
    <div class="floating-words">
        <div class="word w1">FOOD</div>
        <div class="word w2">DELICIOUS</div>
        <div class="word w3">LISTENING</div>
    </div>

    <div class="game-container">
        <h1 class="title">🍔 Food - Listening</h1>
        <p class="sub">Escucha la palabra y elige la oración correcta</p>

        <!-- LOGIN -->
        <div id="login-screen">
            <p style="color:#6c757d; margin-bottom:5px;">Enter your name:</p>
            <input type="text" id="input-name" placeholder="Your name">
            <p style="color:#6c757d; margin-bottom:5px; margin-top:15px;">Enter Access Code:</p>
            <input type="password" id="input-code" placeholder="Code">
            <button onclick="verificarAcceso()">Enter Game</button>
            <p id="login-error">❌ Incorrect code. Try again.</p>
        </div>

        <!-- JUEGO -->
        <div id="game-screen">
            <div class="status-bar">
                <span id="player-name">👋 Welcome, Student!</span>
                <span id="timer-display">⏱️ 100s</span>
            </div>

            <div id="pregunta-container">
                <div id="pregunta">Loading...</div>
                <div id="botones"></div>
            </div>

            <p class="resultado" id="respuesta"></p>
            <p id="contador">Points: 0 / 20</p>

            <div class="final-score-box" id="score-box">
                <h2>🎉 Completed!</h2>
                <p id="final-message" style="font-size:1.3rem; font-weight:bold;"></p>
            </div>
            <a href="menu.html" class="back-btn">← Back to Menu</a>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. SISTEMA DE CÓDIGOS DINÁMICOS (3 INTENTOS)
        // ============================================================
        const getCorrectCode = () => {
            let count = parseInt(localStorage.getItem('food_attempts')) || 0;
            return count >= 3 ? "9999" : "2500";
        };

        let playerName = "Student";
        let timerInterval;
        let timeLeft = 100;
        let juegoTerminado = false;
        let audioContext = null;

        // ============================================================
        // 2. BANCO DE 40 PREGUNTAS - FOOD LISTENING
        // ============================================================
        const BANCO_PREGUNTAS = [
            // PALABRA, EMOJI, ORACIÓN CORRECTA, DISTRACTORES
            { word: 'pizza', emoji: '🍕', correct: 'I love to eat pizza on Fridays.', wrong: ['I drink water every morning.', 'My favorite fruit is apple.', 'I like to play soccer.'] },
            { word: 'apple', emoji: '🍎', correct: 'I eat an apple every day.', wrong: ['I drink coffee in the morning.', 'I love chocolate cake.', 'I like orange juice.'] },
            { word: 'water', emoji: '💧', correct: 'I drink water when I\'m thirsty.', wrong: ['I eat bread with butter.', 'I like cheese on my pizza.', 'I love ice cream in summer.'] },
            { word: 'bread', emoji: '🍞', correct: 'I eat bread with butter for breakfast.', wrong: ['I drink milk before bed.', 'I love pasta with sauce.', 'I eat rice with chicken.'] },
            { word: 'coffee', emoji: '☕', correct: 'I drink coffee every morning.', wrong: ['I eat eggs for breakfast.', 'I love cake on my birthday.', 'I like juice with my meal.'] },
            { word: 'pasta', emoji: '🍝', correct: 'I eat pasta with tomato sauce.', wrong: ['I drink tea in the afternoon.', 'I love salad for lunch.', 'I like soup in winter.'] },
            { word: 'rice', emoji: '🍚', correct: 'I eat rice with chicken and vegetables.', wrong: ['I drink soda with my meal.', 'I love tacos for dinner.', 'I like sandwiches for lunch.'] },
            { word: 'cheese', emoji: '🧀', correct: 'I love cheese on my pizza.', wrong: ['I drink milk in the morning.', 'I eat fish on Fridays.', 'I like meat for dinner.'] },
            { word: 'ice cream', emoji: '🍦', correct: 'I eat ice cream in summer.', wrong: ['I drink hot chocolate in winter.', 'I love cake with candles.', 'I like fruit for dessert.'] },
            { word: 'eggs', emoji: '🥚', correct: 'I eat eggs for breakfast.', wrong: ['I drink juice in the morning.', 'I love pancakes with syrup.', 'I like bacon with my meal.'] },
            { word: 'chocolate', emoji: '🍫', correct: 'I love chocolate cake.', wrong: ['I eat fruit every day.', 'I drink milk before sleeping.', 'I like cookies with tea.'] },
            { word: 'milk', emoji: '🥛', correct: 'I drink milk every morning.', wrong: ['I eat cereal for breakfast.', 'I love yogurt with fruit.', 'I like smoothies in summer.'] },
            { word: 'salad', emoji: '🥗', correct: 'I eat a salad for lunch.', wrong: ['I drink tea in the morning.', 'I love soup in winter.', 'I like pizza on weekends.'] },
            { word: 'fish', emoji: '🐟', correct: 'I eat fish on Fridays.', wrong: ['I eat meat for dinner.', 'I like chicken with rice.', 'I love pasta with sauce.'] },
            { word: 'soup', emoji: '🍜', correct: 'I eat soup when it\'s cold.', wrong: ['I eat rice with chicken.', 'I love salad in summer.', 'I like sandwiches for lunch.'] },
            { word: 'meat', emoji: '🥩', correct: 'I eat meat for dinner.', wrong: ['I eat fish on Fridays.', 'I like pasta with sauce.', 'I love pizza on weekends.'] },
            { word: 'juice', emoji: '🧃', correct: 'I drink orange juice in the morning.', wrong: ['I drink water when I\'m thirsty.', 'I love soda with my meal.', 'I like tea in the afternoon.'] },
            { word: 'cake', emoji: '🎂', correct: 'I eat cake on my birthday.', wrong: ['I eat pancakes for breakfast.', 'I love ice cream in summer.', 'I like cookies with milk.'] },
            { word: 'tea', emoji: '🍵', correct: 'I drink tea in the afternoon.', wrong: ['I drink coffee every morning.', 'I love hot chocolate in winter.', 'I like juice with breakfast.'] },
            { word: 'chicken', emoji: '🍗', correct: 'I eat chicken with rice.', wrong: ['I eat fish on Fridays.', 'I love meat for dinner.', 'I like pasta with sauce.'] },
            { word: 'sandwich', emoji: '🥪', correct: 'I eat a sandwich for lunch.', wrong: ['I eat soup in winter.', 'I love salad for dinner.', 'I like pizza on weekends.'] },
            { word: 'cereal', emoji: '🥣', correct: 'I eat cereal for breakfast.', wrong: ['I eat eggs every morning.', 'I love pancakes with syrup.', 'I like toast with butter.'] },
            { word: 'noodles', emoji: '🍜', correct: 'I eat noodles with vegetables.', wrong: ['I eat rice with chicken.', 'I love pasta with sauce.', 'I like soup in winter.'] },
            { word: 'yogurt', emoji: '🥛', correct: 'I eat yogurt with fruit.', wrong: ['I drink milk every morning.', 'I love cereal for breakfast.', 'I like cheese on my toast.'] },
            { word: 'taco', emoji: '🌮', correct: 'I eat tacos on Tuesdays.', wrong: ['I eat pizza on weekends.', 'I love sandwiches for lunch.', 'I like soup in winter.'] },
            { word: 'pie', emoji: '🥧', correct: 'I eat pie on Thanksgiving.', wrong: ['I eat cake on my birthday.', 'I love cookies with milk.', 'I like ice cream in summer.'] },
            { word: 'butter', emoji: '🧈', correct: 'I put butter on my toast.', wrong: ['I put jam on my bread.', 'I use cheese on my pizza.', 'I add sugar to my coffee.'] },
            { word: 'sauce', emoji: '🥫', correct: 'I add sauce to my pasta.', wrong: ['I add salt to my soup.', 'I add sugar to my tea.', 'I add butter to my bread.'] },
            { word: 'pepper', emoji: '🌶️', correct: 'I add pepper to my soup.', wrong: ['I add salt to my eggs.', 'I add sugar to my coffee.', 'I add ketchup to my fries.'] },
            { word: 'hamburger', emoji: '🍔', correct: 'I eat a hamburger at a restaurant.', wrong: ['I eat pizza on weekends.', 'I love tacos on Tuesdays.', 'I like sandwiches for lunch.'] },
            { word: 'fries', emoji: '🍟', correct: 'I eat fries with my hamburger.', wrong: ['I eat rice with chicken.', 'I love pasta with sauce.', 'I like salad for lunch.'] },
            { word: 'pancakes', emoji: '🥞', correct: 'I eat pancakes with syrup.', wrong: ['I eat cereal for breakfast.', 'I love eggs every morning.', 'I like toast with butter.'] },
            { word: 'smoothie', emoji: '🥤', correct: 'I drink a smoothie in summer.', wrong: ['I drink coffee every morning.', 'I love juice for breakfast.', 'I like tea in the afternoon.'] },
            { word: 'popcorn', emoji: '🍿', correct: 'I eat popcorn at the movies.', wrong: ['I eat cookies with milk.', 'I love ice cream in summer.', 'I like cake on my birthday.'] },
            { word: 'cookies', emoji: '🍪', correct: 'I eat cookies with milk.', wrong: ['I eat cake on my birthday.', 'I love ice cream in summer.', 'I like pie on Thanksgiving.'] },
            { word: 'sushi', emoji: '🍣', correct: 'I eat sushi at a Japanese restaurant.', wrong: ['I eat pizza at an Italian restaurant.', 'I love tacos at a Mexican restaurant.', 'I like hamburgers at a fast food place.'] },
            { word: 'bread', emoji: '🥖', correct: 'I use bread to make a sandwich.', wrong: ['I use rice for dinner.', 'I use pasta with sauce.', 'I use eggs for breakfast.'] },
            { word: 'delicious', emoji: '😋', correct: 'The food is delicious!', wrong: ['The food is terrible!', 'The food is cold!', 'The food is spicy!'] },
            { word: 'breakfast', emoji: '🌅', correct: 'I eat eggs for breakfast.', wrong: ['I eat pasta for lunch.', 'I eat pizza for dinner.', 'I eat cake for dessert.'] },
            { word: 'dinner', emoji: '🌙', correct: 'I eat meat for dinner.', wrong: ['I eat cereal for breakfast.', 'I eat salad for lunch.', 'I eat ice cream for dessert.'] }
        ];

        // ============================================================
        // 3. VARIABLES GLOBALES
        // ============================================================
        let preguntasActuales = [];
        let indiceActual = 0;
        let puntaje = 0;

        // ============================================================
        // 4. LOGIN
        // ============================================================
        function verificarAcceso() {
            const nameInput = document.getElementById('input-name').value.trim();
            const codeInput = document.getElementById('input-code').value.trim();
            const errorMsg = document.getElementById('login-error');

            if (nameInput === "") { alert("Please enter your name."); return; }

            const requiredCode = getCorrectCode();
            if (codeInput !== requiredCode) {
                errorMsg.style.display = "block";
                document.getElementById('input-code').value = "";
                return;
            }

            let count = parseInt(localStorage.getItem('food_attempts')) || 0;
            localStorage.setItem('food_attempts', count + 1);

            errorMsg.style.display = "none";
            playerName = nameInput;
            document.getElementById('login-screen').style.display = "none";
            document.getElementById('game-screen').style.display = "block";
            document.getElementById('player-name').innerHTML = `👋 Welcome, ${playerName}!`;
            iniciarJuego();
        }

        // ============================================================
        // 5. INICIO DEL JUEGO
        // ============================================================
        function iniciarJuego() {
            juegoTerminado = false;
            indiceActual = 0;
            puntaje = 0;

            const mezcladas = [...BANCO_PREGUNTAS].sort(() => Math.random() - 0.5);
            preguntasActuales = mezcladas.slice(0, 20);

            document.getElementById('score-box').style.display = 'none';
            document.getElementById('contador').style.display = 'block';
            document.getElementById('contador').innerHTML = `Points: 0 / 20`;
            document.getElementById('respuesta').innerHTML = '';

            iniciarCronometro();
            mostrarPregunta();
        }

        // ============================================================
        // 6. CRONÓMETRO (100 SEGUNDOS)
        // ============================================================
        function iniciarCronometro() {
            timeLeft = 100;
            document.getElementById('timer-display').innerHTML = `⏱️ ${timeLeft}s`;
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-display').innerHTML = `⏱️ ${timeLeft}s`;
                if (timeLeft <= 0 && !juegoTerminado) {
                    clearInterval(timerInterval);
                    finalizarJuego("⏰ Time's Up!");
                }
            }, 1000);
        }

        // ============================================================
        // 7. SPEAK (TEXT TO SPEECH)
        // ============================================================
        function speakWord(word) {
            if (window.speechSynthesis) {
                // Cancelar cualquier voz anterior
                window.speechSynthesis.cancel();
                
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                utterance.pitch = 1;
                utterance.volume = 1;
                
                // Intentar usar voz femenina si está disponible
                const voices = window.speechSynthesis.getVoices();
                const femaleVoice = voices.find(v => v.lang === 'en-US' && v.name.includes('Samantha'));
                if (femaleVoice) {
                    utterance.voice = femaleVoice;
                }
                
                window.speechSynthesis.speak(utterance);
            } else {
                alert('Your browser does not support speech synthesis. Please use Chrome, Edge, or Safari.');
            }
        }

        // Cargar voces al inicio
        if (window.speechSynthesis) {
            window.speechSynthesis.getVoices();
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

        // ============================================================
        // 8. MOSTRAR PREGUNTA
        // ============================================================
        function mostrarPregunta() {
            if (juegoTerminado) return;

            if (indiceActual >= preguntasActuales.length) {
                finalizarJuego("🎉 Completed!");
                return;
            }

            const q = preguntasActuales[indiceActual];
            
            // Mezclar opciones (correcta + 3 distractores)
            const opciones = [q.correct, ...q.wrong];
            const mezcladas = opciones.sort(() => Math.random() - 0.5);
            
            // Buscar índice de la correcta en la mezcla
            const indiceCorrecta = mezcladas.indexOf(q.correct);

            // Mostrar emoji, palabra clave y botón de audio
            document.getElementById('pregunta').innerHTML = `
                <span class="emoji-big">${q.emoji}</span>
                <span class="instruction-text">🔊 Listen to the word:</span>
                <button class="audio-btn" onclick="speakWord('${q.word}')" id="audioBtn">
                    <span class="speaker">🔊</span> Click to Listen
                </button>
                <span class="key-word">"${q.word}"</span>
                <span class="instruction-text">✏️ Choose the correct sentence:</span>
            `;

            document.getElementById('respuesta').innerHTML = "";
            document.getElementById('contador').innerHTML = `Points: ${puntaje} / ${preguntasActuales.length}`;

            // Generar botones de opciones
            let html = "";
            mezcladas.forEach((opt, idx) => {
                // Resaltar la palabra clave en la oración
                const highlighted = opt.replace(new RegExp(q.word, 'gi'), match => `<span class="highlight">${match}</span>`);
                const isCorrect = idx === indiceCorrecta;
                html += `<button class="btn-opcion" onclick="verificar(${idx}, ${isCorrect})" data-correct="${isCorrect}">${highlighted}</button>`;
            });
            document.getElementById('botones').innerHTML = html;
        }

        // ============================================================
        // 9. VERIFICAR RESPUESTA
        // ============================================================
        function verificar(idx, isCorrect) {
            if (juegoTerminado) return;

            const btns = document.querySelectorAll('.btn-opcion');
            btns.forEach(b => b.disabled = true);

            // Marcar todos los botones (correcto/incorrecto)
            btns.forEach((btn, i) => {
                const correct = btn.dataset.correct === 'true';
                if (correct) {
                    btn.classList.add('correct');
                } else if (i === idx && !isCorrect) {
                    btn.classList.add('wrong');
                }
            });

            const res = document.getElementById('respuesta');
            if (isCorrect) {
                puntaje++;
                res.innerHTML = "✅ Correct! Well done!";
                res.style.color = "#28a745";
            } else {
                // Encontrar la opción correcta
                let correctText = '';
                btns.forEach(btn => {
                    if (btn.dataset.correct === 'true') {
                        correctText = btn.textContent.trim();
                    }
                });
                res.innerHTML = `❌ Incorrect. The correct sentence was: "${correctText}"`;
                res.style.color = "#dc3545";
            }

            indiceActual++;
            document.getElementById('contador').innerHTML = `Points: ${puntaje} / ${preguntasActuales.length}`;

            setTimeout(mostrarPregunta, 1500);
        }

        // ============================================================
        // 10. FINALIZAR JUEGO
        // ============================================================
        function finalizarJuego(mensaje) {
            if (juegoTerminado) return;
            juegoTerminado = true;
            clearInterval(timerInterval);

            // Deshabilitar audio
            const audioBtn = document.getElementById('audioBtn');
            if (audioBtn) audioBtn.disabled = true;

            document.querySelectorAll('.btn-opcion').forEach(b => b.disabled = true);

            // Guardar puntos
            localStorage.setItem('food_score', puntaje);

            let history = JSON.parse(localStorage.getItem('food_history')) || [];
            history.push({
                name: playerName,
                score: puntaje,
                total: preguntasActuales.length,
                date: new Date().toISOString().slice(0, 10),
                game: 'Food - Listening'
            });
            localStorage.setItem('food_history', JSON.stringify(history));

            document.getElementById('score-box').style.display = 'block';
            document.getElementById('final-message').innerHTML =
                `${mensaje}<br>${playerName}, you got <span style="color:#e74c3c; font-size:2rem;">${puntaje}</span> out of ${preguntasActuales.length} correct!`;

            document.getElementById('contador').style.display = 'none';
            document.getElementById('respuesta').innerHTML = '';
            document.getElementById('pregunta').innerHTML = '🏁 Game Finished!';
            document.getElementById('botones').innerHTML = '';
        }

        // ============================================================
        // 11. PERMITIR ENTER EN LOGIN
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const loginScreen = document.getElementById('login-screen');
                if (loginScreen.style.display !== 'none') {
                    verificarAcceso();
                }
            }
        });

        // Cargar voces al iniciar
        if (window.speechSynthesis) {
            window.speechSynthesis.getVoices();
        }
    </script>
</body>
</html>
